version: 2
models:
- name: customer_features
  description: One eligible anchor customer row; uncertainlabels retained. Predictors
    use anchor only. Metadata and lifetimecounts are not predictors. No imputation
    or later substitution.
  columns:
  - name: customer_unique_id
    description: Stable person key, exactly one eligible row.
    tests:
    - not_null
    - unique
  - name: customer_state
    description: State on anchor customer record.
    tests:
    - not_null
  - name: first_delivered_order_id
    description: Earliest delivered purchase, ties by order ID before eligibility.
    tests:
    - not_null
  - name: first_delivered_purchase_ts
    description: Timezone-naive source anchor purchase timestamp.
    tests:
    - not_null
  - name: target_window_end_ts
    description: Anchor purchase plus180days, inclusive repeat boundary.
    tests:
    - not_null
  - name: observation_end_ts
    description: All-status max recorded purchase or valid explicit override; coverage
      assumption.
    tests:
    - not_null
  - name: observation_end_provenance
    description: maximum_recorded_purchase or explicit_override.
    tests:
    - not_null
  - name: as_of_date
    description: Frozen calendar date from all-status max purchase or valid override.
    tests:
    - not_null
  - name: has_complete_followup
    description: Target window end is no later than observation end.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - true
          - false
          quote: false
  - name: repeat_within_180_days
    description: 1 observed repeat,0 completefollowup withnone,NULL unfinished withnone.
    tests:
    - accepted_values:
        arguments:
          values:
          - 0
          - 1
          quote: false
  - name: total_orders
    description: Lifetime distinct delivered order count, descriptive only.
    tests:
    - not_null
  - name: total_spent
    description: Anchor sum of all payments; only absent payment rows recover known
      itemprice+freight sum.
    tests:
    - not_null
  - name: seconds_since_first_purchase
    description: Frozen calendar date minus anchor date multiplied86400.
    tests:
    - not_null
  - name: favorite_payment_type
    description: Largest summed payment-type share, deterministic alphabetical tie;
      unrecoverable null excluded.
    tests:
    - not_null
  - name: item_count
    description: Positive integer anchor item-line count without fan-out.
    tests:
    - not_null
  - name: freight_value
    description: Anchor item freight sum; any null constituent remains unknown.
    tests:
    - not_null
  - name: used_voucher
    description: Any anchor payment type voucher.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - true
          - false
          quote: false
  - name: delivery_seconds
    description: Elapsed purchase to customer-delivery epochseconds, fractions preserved.
    tests:
    - not_null
  - name: approval_seconds
    description: Elapsed purchase to approval epochseconds, fractions preserved.
    tests:
    - not_null
  - name: carrier_seconds
    description: Elapsed purchase to carrier epochseconds, fractions preserved.
    tests:
    - not_null
  - name: after_estimated_delivery_seconds
    description: Nonnegative calendar-date lateness multiplied86400; same-date zero.
    tests:
    - not_null
  - name: review_below_average
    description: Any staged anchor review strictly below extract-wide staged average;
      absencefalse.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - true
          - false
          quote: false
  - name: has_first_order_review
    description: At least one staged anchor review, independent of laterorders.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - true
          - false
          quote: false
- name: customer_feature_diagnostics
  description: All firstdelivered candidates before exclusions. Single source for
    mart eligibility and reconciling census; originaltimestamps and reasonarrays preserved.
  columns:
  - name: customer_unique_id
    tests:
    - not_null
    - unique
  - name: first_delivered_order_id
    tests:
    - not_null
  - name: is_eligible
    tests:
    - not_null
  - name: exclusion_reasons
    description: Overlapping reasons; cardinality0 selects eligible.
  - name: warning_reasons
    description: Overlapping retained lifecycle and monetarywarnings.
