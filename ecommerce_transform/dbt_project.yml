# Typed Olist staging + customer_features mart (repeat-buyer scoring on Postgres).
name: 'ecommerce_transform'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_transform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Frozen recency date (YYYY-MM-DD). Unset → max(order_purchase_ts)::date from stg_orders.
  as_of_date: null

models:
  ecommerce_transform:
    staging:
      +materialized: view
    marts:
      +materialized: table
